services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: impactlink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: impactlink
    volumes:
      - impactlink_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impactlink"]
      interval: 5s
      timeout: 5s
      retries: 12
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://impactlink:${POSTGRES_PASSWORD}@database:5432/impactlink
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DEMO_MODE: ${DEMO_MODE:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      database:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [backend]
volumes:
  impactlink_data:
